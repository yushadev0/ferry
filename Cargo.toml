[workspace]
resolver = "2"
members = ["crates/ferry-core", "crates/ferry-host", "app/src-tauri"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yushadev0/ferry"
authors = ["yushadev0"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Small, fast release builds (see https://tauri.app/concept/size/).
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
