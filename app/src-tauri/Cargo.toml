[package]
name = "ferry-app"
description = "Ferry Download Center desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the binary on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "ferry_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ferry-core = { path = "../../crates/ferry-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
png = "0.18.1"
base64 = "0.23.1"
interprocess = { version = "2.4", features = ["tokio"] }
ferry-host = { version = "0.1.0", path = "../../crates/ferry-host" }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
file_icon_provider = "1.0.2"

[target."cfg(windows)".dependencies]
winreg = "0.56"
